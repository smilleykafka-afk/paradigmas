services: 
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
    user: "1000:1000"
    depends_on:
    - mysql

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: paradigmas-prog
      MYSQL_USER: paradigmas
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

  adminer:
    image: adminer
    ports:
      - "8000:8000"
    depends_on:
      - mysql

volumes: 
  mysql-data:
